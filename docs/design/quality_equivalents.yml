# Surviving mutants that cannot change behaviour, and why. bin/quality-report matches a
# survivor to an entry by subject and by the changed lines of its diff (whitespace
# ignored), counts it as equivalent, and renders this list as the table in
# docs/design/quality.md. An entry that no longer matches any survivor is reported as
# stale. Keep the reasons specific: "cannot happen" must say why it cannot.
#
# Recurring reasons, referenced below:
# - [index] `a[i]`, `a.at(i)` and `a.fetch(i)` differ only when i is out of range, and
#   the array is a fixed-shape tuple built a few lines earlier or a constant.
# - [sorbet] T.let/T.must/T.cast and generic type arguments only matter to the static
#   checker. sorbet-runtime erases generic element types, T.must is only reached with a
#   non-nil value, and srb tc rejects the mutated annotation anyway.
# - [subclass] `is_a?` vs `instance_of?` differs only for a subclass, and the class has
#   none; a new subclass would be a design change that brings its own tests.

# ---- money core ------------------------------------------------------------
- subject: Clearinghouse::Money.parse
  mutation: |
    -  minor = (Integer(T.must(match[2]), 10) * Currency.scale(currency)) + (if padded.empty?
    +  minor = (Integer(match[2], 10) * Currency.scale(currency)) + (if padded.empty?
  why: "[sorbet] Group 2 is `(\\d+)`, not optional, so it is set whenever the regex matched; T.must is there for srb tc."
- subject: 'Clearinghouse::Money#<=>'
  mutation: |
    -  unless other.is_a?(Money) && other.currency == currency
    +  unless other.instance_of?(Money) && other.currency == currency
  why: "[subclass] Money has no subclasses."
- subject: 'Clearinghouse::Money#=='
  mutation: |
    -  unless other.is_a?(Money)
    +  unless other.instance_of?(Money)
  why: "[subclass] Money has no subclasses."
- subject: 'Clearinghouse::Money#=='
  mutation: |
    -  unless other.is_a?(Money)
    -    return false
    -  end
    -  other.currency == currency && other.amount == amount
    +  super
  why: >-
    Money includes Comparable, so `super` is Comparable#==, which is false when `<=>` returns
    nil (not Money, or another currency) and compares amounts otherwise. That is the same
    relation. The explicit method stays so equality does not depend on `<=>`'s nil rules.
- subject: 'Clearinghouse::Money#to_s'
  mutation: |
    -  sign = if amount.negative?
    +  sign = if self.negative?
  why: "Money#negative? is `amount.negative?`."
- subject: 'Clearinghouse::Money#to_s'
  mutation: |
    -  else
    -    ""
  why: "Without the else the sign is nil for a non-negative amount, and nil interpolates as an empty string."
- subject: 'Clearinghouse::Money#to_s'
  mutation: |
    -    ""
    +    nil
  why: "nil interpolates as an empty string."
- subject: 'Clearinghouse::Money#to_s'
  mutation: |
    -    whole.to_s
    +    whole
  why: "The branch value is only interpolated into the result, and interpolation calls the Integer's to_s anyway."

# ---- webhook signatures -----------------------------------------------------
- subject: Clearinghouse::Webhooks::Signature.compute
  mutation: |
    -  OpenSSL::HMAC.hexdigest("SHA256", secret.b, "#{timestamp_text}.".b + payload.b)
    +  OpenSSL::HMAC.hexdigest("SHA256", secret, "#{timestamp_text}.".b + payload.b)
  why: "OpenSSL::HMAC reads the key's bytes whatever its encoding; `.b` only relabels the same bytes."
- subject: Clearinghouse::Webhooks::Signature.compute
  mutation: |
    -  OpenSSL::HMAC.hexdigest("SHA256", secret.b, "#{timestamp_text}.".b + payload.b)
    +  OpenSSL::HMAC.hexdigest("SHA256", secret.b, "#{timestamp_text}." + payload.b)
  why: >-
    The prefix is ASCII digits and a dot, and an ASCII-only UTF-8 string concatenates with a
    binary one to the same bytes. (Dropping `.b` on the payload is not equivalent, and a
    UTF-16 payload test kills it.)
- subject: Clearinghouse::Webhooks::Signature.parse
  mutation: |
    -  timestamp_text = T.let(nil, T.nilable(String))
    +  timestamp_text = nil
  why: "[sorbet]"
- subject: Clearinghouse::Webhooks::Signature.parse
  mutation: |
    -  signatures = T.let([], T::Array[String])
    +  signatures = T.let([], T::Array[nil])
  why: "[sorbet] The element type is erased at runtime."
- subject: Clearinghouse::Webhooks::Signature.parse
  mutation: |
    -  header.b.split(",", -1).each { |raw|
    +  header.b.split(",", -1) { |raw|
  why: "String#split with a block yields each piece in order, the same as calling each on the array; the return value is unused."
- subject: Clearinghouse::Webhooks::Signature.parse
  mutation: |
    -  header.b.split(",", -1).each { |raw|
    +  header.b.split(",", -2).each { |raw|
  why: "Any negative limit means the same thing to String#split: no limit, keep trailing empty fields."
- subject: Clearinghouse::Webhooks::Signature.verify
  mutation: |
    -  Result.new(error: nil, timestamp: parsed.timestamp)
    +  Result.new(timestamp: parsed.timestamp)
  why: "`error` is a nilable T::Struct prop, so leaving it out sets it to nil. The explicit nil is there for the reader."
- subject: Clearinghouse::Webhooks::Signature.verify!
  mutation: |
    -  T.must(result.timestamp)
    +  result.timestamp
  why: "[sorbet] verify sets the timestamp on every result whose error is nil, and that is the only way to get here."

