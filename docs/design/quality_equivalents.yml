    +accounts.keys.each { |key|
  why: 'Not equivalent: the sort makes concurrent first postings that create the same new accounts take their row locks in one order, so they cannot deadlock. Killing it needs two sessions paused between their account inserts, and nothing in posting exposes that point. The six-thread spec exercises the balance-row order but not this one reliably. Left alive and counted as a survivor.'
