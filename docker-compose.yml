services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clearinghouse_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: clearinghouse_dev
    ports:
      - "54329:5432"
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearinghouse_owner"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
